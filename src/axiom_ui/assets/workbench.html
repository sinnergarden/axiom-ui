<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-{{SCRIPT_HASH}}'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Axiom · 研究工作台</title><style>{{CSS}}</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand">AXIOM<span>研究工作台 · 只读</span></div>
<details id="experiment-navigation" open><summary class="small">实验导航 · 选择已保存记录</summary><div class="filters" aria-label="实验筛选"><button data-filter="all" class="active">近期</button><button data-filter="favorite">收藏</button><button data-filter="shelved">搁置</button></div>
<label class="small" for="status-filter">状态 / 标签</label><div class="filter-selects"><select id="status-filter" aria-label="状态筛选"><option value="">全部状态</option></select><select id="tag-filter" aria-label="标签筛选"><option value="">全部标签</option></select></div>
<div id="run-tree"></div><p id="navigation-note" class="small"></p></details><div class="sidebar-foot small">说明与标记来自 Research。<br>这里选择和比较已保存结果。</div></aside>
<main><div class="topline"><span id="context-line"></span><span id="evidence-badge" class="badge"></span></div>
<div class="hero"><div><h1 id="run-title"></h1><p id="hypothesis" class="small"></p></div><button id="copy-context" class="btn">复制讨论摘要</button></div>
<div class="subline"><span id="date-range"></span><span id="run-status" class="pill"></span><span id="policy-badge" class="pill"></span></div>
<div id="notice" class="notice" role="status"></div><div id="metrics" class="metrics"></div>
<nav class="tabs" aria-label="结果视图"><button data-pane="performance" class="active">收益与风险</button><button data-pane="trade">交易复盘</button><button data-pane="statistics">月收益与持仓段</button></nav>
<div id="selection-context" class="small"></div>
<section id="performance" class="pane active" aria-label="收益风险及结果对比"><div class="panel"><div class="panel-head"><h2>收益与风险 <span>/ 回测结果对比</span></h2><div class="chart-actions"><label><input id="benchmark-toggle" type="checkbox" checked>沪深300</label><select id="compare-run" aria-label="旧运行对照"><option value="">添加运行对照</option></select></div></div>
<div id="comparison-notice" class="small"></div><div id="performance-chart" class="chart"></div><div id="nav-point" class="point-readout"></div><p id="benchmark-note" class="small"></p></div>
<details class="settings"><summary>公共设置与版本变动</summary><div id="configuration-differences"></div><pre id="configuration-values"></pre></details><p class="small">区间选择只定位原值；未保存的区间指标不在前端计算。</p></section>
<section id="trade" class="pane" aria-label="交易复盘"><div class="panel"><div class="panel-head"><h2>价格与交易复盘</h2><div class="chart-actions"><select id="security-select" aria-label="证券选择"></select><input id="session-select" type="date" aria-label="交易日选择"></div></div>
<p id="candle-note" class="small"></p><div class="trade-grid"><div id="trade-chart" class="chart"></div><aside id="trade-point" class="point-panel"></aside></div><div class="event-tabs"><button data-event-kind="fills" class="active">成交</button><button data-event-kind="orders">委托</button><button data-event-kind="decisions">决策</button></div><div id="event-list"></div></div></section>
<section id="statistics" class="pane" aria-label="月收益及完整持仓段"><div class="panel"><h2>账户月收益</h2><p class="small">百分比 · 完整 / 部分 / 缺失分别标记</p><div id="month-heatmap" class="heat-scroll"></div></div><div class="stats-grid"><div class="panel"><h2>完整持仓段净盈亏分布</h2><div id="episode-chart" class="chart"></div><p id="distribution-note" class="small"></p></div><div class="panel"><h2>标准持仓段统计</h2><div id="episode-metrics"></div><details><summary>统计定义与排除样本</summary><pre id="episode-definition"></pre></details></div></div><div class="panel"><h2>闭合与开放持仓段</h2><div id="episode-list"></div></div><div class="panel"><h2>信号评价 · Research</h2><p id="signal-evaluation" class="small"></p></div></section>
<details class="data-info"><summary>数据与运行信息</summary><div id="source-details"></div><pre id="source-refs"></pre></details>
<p id="generated-note" class="footer-note"></p><div id="toast" role="status" aria-live="polite"></div></main></div>
<script type="application/json" id="workbench-data">{{DATA}}</script><script>{{SCRIPT}}</script></body></html>
