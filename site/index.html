<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https: http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer"><title>Axiom · 研究实验结果</title><link rel="stylesheet" href="app.css"><script src="config.js" defer></script><script src="app.js" defer></script></head>
<body><header><strong>Axiom</strong><span>研究实验 · 只读结果</span><button id="disconnect" hidden>断开连接</button></header>
<main><section id="connection"><h1>连接研究结果</h1><p>连接你的 Mac 结果服务，查看正式登记实验、保存指标与账户曲线。Mac 需要保持在线。</p>
<form id="connect"><label for="endpoint">结果服务 HTTPS 地址</label><input id="endpoint" type="url" placeholder="https://your-mac.example" required autocomplete="off" spellcheck="false"><label for="token">访问码</label><input id="token" type="password" required minlength="43" maxlength="128" autocomplete="off" spellcheck="false"><button type="submit">连接并查看实验</button></form><p class="hint">访问码只在当前页面内存中使用。刷新页面或断开连接后需重新输入。</p></section>
<p id="status" role="status" aria-live="polite">尚未连接。此公开页面不包含私有结果。</p><nav id="navigation" hidden><button id="home">实验列表</button><button id="refresh">刷新保存索引</button></nav><article id="results" aria-live="polite"></article></main></body></html>
