[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-ui"
version = "0.2.0"
requires-python = ">=3.11"
description = "Read-only Axiom research workbench and chart projections"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axiom_ui = ["assets/*.html", "assets/*.css", "assets/*.js"]
